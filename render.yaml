services:
  - type: web
    name: carbon-optimizer-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:3000,*"
